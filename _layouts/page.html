---
layout: default
---
<div class="contenitore{% unless page.immagine %} stretto{% endunless %}">
  <div class="{% if page.immagine %}con-figura{% endif %}">
    <article class="pagina">
      <h1>{{ page.title }}</h1>
      {% if page.sottotitolo %}<p class="sottotitolo">{{ page.sottotitolo }}</p>{% endif %}
      {{ content }}
    </article>
    {% if page.immagine %}
    <figure class="figura"><img src="{{ page.immagine | relative_url }}" alt=""></figure>
    {% endif %}
  </div>
</div>
